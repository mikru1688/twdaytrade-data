name: Collect open data

on:
  schedule:
    # Taipei = UTC+8.
    # Off-minute times: GitHub delays top-of-hour schedules by hours.
    - cron: "47 9 * * 1-5"   # Mon–Fri 17:47 collect
    - cron: "13 13 * * 1-5"  # Mon–Fri 21:13 collect + daily summary
    - cron: "13 23 * * 0-4"  # Mon–Fri 07:13 check previous trading day + TAIFEX night session
    - cron: "43 6 * * 1-5"   # Mon–Fri 14:43 TAIFEX day session
    - cron: "17 1 * * 1-5"   # Mon–Fri 09:17 backup (catches delayed/missed runs)
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: collect
  cancel-in-progress: false

env:
  STATUS_PATH: ${{ github.workspace }}/status.json
  STATUS_ISSUE_TITLE: Collector status

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Reruns would otherwise check out the original SHA and conflict with data pushed since.
          ref: ${{ github.ref_name }}

      - name: Resolve slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "47 9 * * 1-5") echo "slot=17:47" >> "$GITHUB_OUTPUT" ;;
            "13 13 * * 1-5") echo "slot=21:13 總結" >> "$GITHUB_OUTPUT" ;;
            "13 23 * * 0-4") echo "slot=07:13 檢查" >> "$GITHUB_OUTPUT" ;;
            "43 6 * * 1-5") echo "slot=14:43 期貨日盤" >> "$GITHUB_OUTPUT" ;;
            "17 1 * * 1-5") echo "slot=09:17 備援" >> "$GITHUB_OUTPUT" ;;
            *) echo "slot=手動" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Collect raw open data
        id: collect
        run: python3 scripts/collect.py

      - name: Commit
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "result=無變更" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git commit -m "data: $(TZ=Asia/Taipei date '+%F %H:%M') ${{ steps.slot.outputs.slot }}"
          for i in 1 2 3; do
            if git push; then echo "result=已 commit" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep $((i * 10))
            # During rebase "theirs" is this run's commit: the newer fetch wins for same-day files.
            git pull --rebase -X theirs || git rebase --abort
          done
          echo "result=push 失敗" >> "$GITHUB_OUTPUT"; exit 1

      - name: Upload status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status
          path: status.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Notify
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SLOT: ${{ steps.slot.outputs.slot }}
          COMMIT_RESULT: ${{ steps.commit.outputs.result }}
          JOB_STATUS: ${{ steps.collect.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          overall=$(python3 -c "import json,os;print(json.load(open(os.environ['STATUS_PATH']))['overall'])" 2>/dev/null || echo FAILED)
          prev_id=$(gh run list -R "$GITHUB_REPOSITORY" -w "Collect open data" --status completed -L 5 --json databaseId --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)][0].databaseId")
          prev=NONE
          if [ -n "$prev_id" ] && gh run download "$prev_id" -R "$GITHUB_REPOSITORY" -n status -D prev-status 2>/dev/null; then
            prev=$(python3 -c "import json;print(json.load(open('prev-status/status.json'))['overall'])" 2>/dev/null || echo NONE)
          fi
          notify=no
          case "$overall" in FAILED|INVALID|SUSPECTED_CLOSED) notify=yes ;; esac
          [ "$SLOT" = "21:13 總結" ] && notify=yes
          [ "$SLOT" = "手動" ] && notify=yes
          if { [ "$SLOT" = "07:13 檢查" ] || [ "$SLOT" = "09:17 備援" ]; } && { [ "$overall" != "OK" ] || [ "$prev" != "OK" ]; }; then notify=yes; fi
          echo "overall=$overall prev=$prev slot=$SLOT notify=$notify"
          [ "$notify" = "yes" ] || exit 0
          python3 scripts/notify.py > comment.md
          num=$(gh issue list --state open --search "\"$STATUS_ISSUE_TITLE\" in:title" --json number,title --jq ".[] | select(.title == \"$STATUS_ISSUE_TITLE\") | .number" | head -n 1)
          if [ -z "$num" ]; then
            url=$(gh issue create --title "$STATUS_ISSUE_TITLE" --body "每次 collector 執行的結果會留言在這裡（失敗即時、每個交易日 21:13 總結、隔日 07:13 檢查與 09:17 備援有異常時）。")
            num=${url##*/}
            gh issue pin "$num" || true
          fi
          gh issue comment "$num" --body-file comment.md
